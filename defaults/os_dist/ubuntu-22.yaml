---
ssh_server_hardening: true
infra_sshd_ciphers:
  # - 3des-cbc
  # - aes128-cbc
  - aes128-ctr
  - aes128-gcm@openssh.com
  # - aes192-cbc
  - aes192-ctr
  # - aes256-cbc
  - aes256-ctr
  - aes256-gcm@openssh.com
  - chacha20-poly1305@openssh.com
  # - rijndael-cbc@lysator.liu.se
infra_sshd_MACs:
  # - hmac-md5
  # - hmac-md5-96
  # - hmac-md5-96-etm@openssh.com
  # - hmac-md5-etm@openssh.com
  # - hmac-sha1
  # - hmac-sha1-96
  # - hmac-sha1-96-etm@openssh.com
  # - hmac-sha1-etm@openssh.com
  - hmac-sha2-256
  - hmac-sha2-256-etm@openssh.com
  - hmac-sha2-512
  - hmac-sha2-512-etm@openssh.com
  - umac-128-etm@openssh.com
  - umac-128@openssh.com
  # - umac-64-etm@openssh.com
  # - umac-64@openssh.com
infra_sshd_kex_gss:
  - gss-gex-sha1-
  - gss-group1-sha1-
  - gss-group14-sha1-
  - gss-group14-sha256-
  - gss-group16-sha512-
  - gss-nistp256-sha256-
  - gss-curve25519-sha256-
infra_sshd_kex:
  - curve25519-sha256
  - curve25519-sha256@libssh.org
  # - diffie-hellman-group-exchange-sha1
  # - diffie-hellman-group-exchange-sha256
  # - diffie-hellman-group1-sha1
  # - diffie-hellman-group14-sha1
  - diffie-hellman-group14-sha256
  - diffie-hellman-group16-sha512
  - diffie-hellman-group18-sha512
  # - ecdh-sha2-nistp256
  # - ecdh-sha2-nistp384
  # - ecdh-sha2-nistp521
  # - sntrup4591761x25519-sha512@tinyssh.org
infra_sshd_host_key:
  # - ecdsa-sha2-nistp256
  - ecdsa-sha2-nistp256-cert-v01@openssh.com
  - ecdsa-sha2-nistp384
  - ecdsa-sha2-nistp384-cert-v01@openssh.com
  - ecdsa-sha2-nistp521
  - ecdsa-sha2-nistp521-cert-v01@openssh.com
  - sk-ecdsa-sha2-nistp256-cert-v01@openssh.com
  - sk-ecdsa-sha2-nistp256@openssh.com
  - sk-ssh-ed25519-cert-v01@openssh.com
  - sk-ssh-ed25519@openssh.com
  - ssh-dss
  - ssh-dss-cert-v01@openssh.com
  - ssh-ed25519
  - ssh-ed25519-cert-v01@openssh.com
  # - ssh-rsa
  - ssh-rsa-cert-v01@openssh.com
  - rsa-sha2-256
  - rsa-sha2-512
infra_sshd_pubkey_type: "{{ infra_sshd_host_key }}"
infra_sshd_CA_sig:
  - ecdsa-sha2-nistp256
  - ecdsa-sha2-nistp384
  - ecdsa-sha2-nistp521
  - rsa-sha2-256
  - rsa-sha2-512
  - sk-ecdsa-sha2-nistp256@openssh.com
  - sk-ssh-ed25519@openssh.com
  - ssh-dss
  - ssh-ed25519
  - ssh-rsa
infra_sshd_variable_name: SSHD_OPTS
infra_sshd_variable_file: /etc/default/ssh
infra_source_list:
  - url: http://archive.ubuntu.com/ubuntu/
    type: "main restricted universe multiverse"
    distro:
      - jammy
      - jammy-updates
      - jammy-security
      - jammy-backports
sshd_moduli_minimum: 3071
