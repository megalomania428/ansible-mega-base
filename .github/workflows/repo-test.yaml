# kics-scan disable=555ab8f9-2001-455e-a077-f2d0f41e2fb9
---
name: role test
on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: "11 11 * * 1"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  default:
    name: t
    timeout-minutes: 33
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ansible_ver:
          - "06"
          - "07"
          - "08"
          - "09"
          - "10"
          - "11"
    steps:
      - uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses]
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - name: test role
        env:
          APPIMAGE_NAME: "ansible-${{ matrix.ansible_ver }}-001.AppImage"
        run: molecule/default/run-tests.sh
  linters:
    name: linters
    timeout-minutes: 11
    runs-on: ubuntu-24.04
    if: github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses]
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - name: lint the repo
        env:
          BRA: master
        run: |
          curl -sL \
          https://raw.githubusercontent.com/raven428/container-images/refs/heads/${{
          env.BRA }}/sources/linters-ubuntu-22_04/check-dir.sh | bash
          curl -sL \
          https://raw.githubusercontent.com/raven428/container-images/refs/heads/${{
          env.BRA }}/sources/ansible-ubuntu/check-dir.sh | bash
  MegaLinter:
    name: MegaLinter
    timeout-minutes: 11
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses]
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - name: MegaLinter
        uses: oxsecurity/megalinter@v9 # zizmor: ignore[unpinned-uses]
  all-green:
    name: all green
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs:
      - default
      - linters
      - MegaLinter
    if: github.event_name == 'pull_request'
    permissions:
      checks: read
    steps:
      - name: waiting for checks success
        uses: poseidon/wait-for-status-checks@v0.6.0 # zizmor: ignore[unpinned-uses]
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore: all green, foobar
          timeout: 111s
